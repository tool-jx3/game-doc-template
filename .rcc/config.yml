release_automation:
  decision: declined
  tool: none
  configured_at: "2026-08-15"
  notes: "game-doc-template is a documentation template project, not a published package — no versioned releases to automate."

settings_scope:
  safety_bypass: .claude/settings.json
  permissions: .claude/settings.local.json
